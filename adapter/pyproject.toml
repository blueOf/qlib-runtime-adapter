[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-project"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb==1.4.3",
    "jsonschema==4.26.0",
    "ruamel.yaml==0.19.1",
    "tzdata==2026.4",
]

[project.optional-dependencies]
models = [
    "numpy==2.2.6",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
    "threadpoolctl==3.6.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
